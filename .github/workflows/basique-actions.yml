name: Run_test

on: 
  push:
    branches: [**] 
  pull_request:
    branches: [**] 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v5
      
      - run: uv sync --dev
      - run: uv run pytest